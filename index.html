<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Feature Tracker</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --border:#e2e5ea; --text:#1d2330; --muted:#6b7280;
  --accent:#4f46e5; --accent-soft:#eef0ff; --danger:#dc2626; --warn:#d97706;
  --s-todo:#9ca3af; --s-progress:#3b82f6; --s-testing:#8b5cf6; --s-hold:#f59e0b; --s-done:#16a34a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a; --text:#e6e8ec; --muted:#9aa1ad;
    --accent:#818cf8; --accent-soft:#252a45; --danger:#f87171; --warn:#fbbf24;
    --s-todo:#6b7280; --s-progress:#60a5fa; --s-testing:#a78bfa; --s-hold:#fbbf24; --s-done:#4ade80;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a; --text:#e6e8ec; --muted:#9aa1ad;
  --accent:#818cf8; --accent-soft:#252a45; --danger:#f87171; --warn:#fbbf24;
  --s-todo:#6b7280; --s-progress:#60a5fa; --s-testing:#a78bfa; --s-hold:#fbbf24; --s-done:#4ade80;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button:disabled,select:disabled,input:disabled,textarea:disabled{opacity:.6;cursor:not-allowed}
a{color:var(--accent)}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:260px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 16px 8px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px}
.who{margin:0 16px 6px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rolechip{font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.nav{padding:4px 8px;overflow:auto;flex:1}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 10px 6px;display:flex;justify-content:space-between;align-items:center}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--panel2)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .pc{font-size:11px;color:var(--muted)}
.nav-item .badge{font-size:11px;background:var(--panel2);border-radius:99px;padding:1px 7px;color:var(--muted)}
.cdot{width:10px;height:10px;border-radius:3px;flex-shrink:0;display:inline-block}
.side-foot{padding:10px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:6px}
/* Main */
.main{flex:1;min-width:0;padding:24px 28px 60px}
h1{font-size:22px;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub{color:var(--muted);margin-top:4px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--border);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:5px 8px;font-size:12px}
.btn.danger{color:var(--danger)}
.btn.err{color:var(--danger);border-color:var(--danger)}
.btn.ok{color:var(--s-done)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--panel);padding:7px 12px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.icon-btn{border:none;background:none;cursor:pointer;padding:4px 6px;border-radius:6px;color:var(--muted)}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
input[type=text],input[type=email],input[type=search],input[type=date],select,textarea{border:1px solid var(--border);background:var(--panel);padding:7px 10px;border-radius:8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{width:100%;resize:vertical;min-height:70px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
/* Roles: hide admin-only / edit-only controls */
.role-member .adm,.role-viewer .adm,.role-viewer .edt{display:none!important}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:20px 0}
.kpi{padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px}
.kpi .l{font-size:12px;color:var(--muted)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--panel2)}
.bar>div{height:100%}
.st-todo{background:var(--s-todo)}.st-progress{background:var(--s-progress)}.st-testing{background:var(--s-testing)}.st-hold{background:var(--s-hold)}.st-done{background:var(--s-done)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.p-High{color:#ea580c}.pill.p-Critical{color:#fff;background:var(--danger)}
.pill.overdue{background:var(--danger);color:#fff}
.pill.soon{color:var(--warn)}
.av{width:24px;height:24px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;display:inline-grid;place-items:center;flex-shrink:0}
/* Dashboard */
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.sw-card{padding:16px;cursor:pointer;transition:border-color .15s;border-top-width:4px}
.sw-card:hover{border-color:var(--accent)}
.sw-card h3{margin:0;font-size:16px}
.sw-card .desc{font-size:12px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw-card .counts{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:12px;text-align:center}
.sw-card .counts b{display:block;font-size:16px}
.sw-card .counts span{font-size:10px;color:var(--muted)}
.big-pct{font-size:22px;font-weight:700}
section.block{margin-top:26px}
section.block h2{font-size:15px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
.list li.click{cursor:pointer}
.list li.click:hover{background:var(--panel2)}
.list li:last-child{border-bottom:none}
.list .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .m{font-size:12px;color:var(--muted);white-space:nowrap}
.hbar{display:flex;align-items:center;gap:10px;padding:8px 14px}
.hbar .lb{width:110px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{flex:1;height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.hbar .tr div{height:100%;border-radius:99px}
.hbar .n{width:80px;text-align:right;font-size:12px;color:var(--muted)}
.empty-s{padding:16px;color:var(--muted);font-size:13px}
/* Toolbar */
.toolbar{margin:18px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--panel);border-radius:99px;padding:4px 11px;font-size:12px;cursor:pointer}
.chip b{font-weight:600;opacity:.75}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* Headings / list */
.heading{margin-top:16px;overflow:hidden}
.heading-hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--panel2);flex-wrap:wrap}
.heading-hd h3{margin:0;font-size:15px;flex:1;cursor:pointer;user-select:none;min-width:120px}
.heading-hd .caret{display:inline-block;transition:transform .15s;margin-right:6px;color:var(--muted)}
.heading.collapsed .caret{transform:rotate(-90deg)}
.heading.collapsed .heading-body{display:none}
.heading.collapsed .heading-hd{border-bottom:none}
.hcount{font-size:12px;color:var(--muted)}
.task{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 6px;border-bottom:1px solid var(--border);background:var(--panel)}
.task:hover{background:var(--panel2)}
.task.dragging,.kcard.dragging{opacity:.4}
.grip{cursor:grab;color:var(--muted);opacity:.4;font-size:12px;letter-spacing:-2px;padding:0 2px;user-select:none;width:14px}
.task:hover .grip{opacity:1}
.task input[type=checkbox]{width:17px;height:17px;accent-color:var(--s-done);cursor:pointer;flex-shrink:0}
.task .title{flex:1;min-width:0;cursor:pointer}
.task .tt{overflow:hidden;text-overflow:ellipsis}
.task.is-done .tt{text-decoration:line-through;color:var(--muted)}
.tmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;align-items:center}
.last-c{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
select.status{padding:4px 8px;font-size:12px;border-radius:99px;font-weight:600;border-width:2px}
select.s-todo{border-color:var(--s-todo)}select.s-progress{border-color:var(--s-progress)}select.s-testing{border-color:var(--s-testing)}select.s-hold{border-color:var(--s-hold)}select.s-done{border-color:var(--s-done)}
.cbtn{font-size:12px;color:var(--muted);border:none;background:none;cursor:pointer;padding:4px 6px;border-radius:6px;white-space:nowrap}
.cbtn:hover{background:var(--panel)}
.add-task{display:flex;gap:6px;padding:10px 14px;flex-wrap:wrap}
.add-task input{flex:1;min-width:180px}
.drag-over{outline:2px dashed var(--accent);outline-offset:-2px}
.no-tasks{padding:14px;color:var(--muted);font-size:13px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .e-ic{font-size:40px;margin-bottom:8px}
/* Board */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;margin-top:16px;padding-bottom:8px}
.col{background:var(--panel2);border-radius:12px;padding:10px;min-height:300px}
.col-hd{display:flex;align-items:center;gap:6px;font-weight:600;margin:2px 4px 10px}
.col-hd .hcount{flex:1}
.kcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.kcard[draggable=true]{cursor:grab}
.kcard:hover{border-color:var(--accent)}
.kcard .kt{font-weight:600;margin-bottom:4px;word-break:break-word}
.kcard .kh{font-size:11px;color:var(--muted);margin-bottom:6px}
.kcard .kf{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
/* Table */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:820px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);background:var(--panel2)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click:hover td{background:var(--panel2);cursor:pointer}
.tbl .done-t{text-decoration:line-through;color:var(--muted)}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto}
.ov.show{display:flex}
.modal{width:100%;max-width:640px;padding:20px}
.modal h2{margin:0 0 14px;font-size:17px}
.modal h3{font-size:14px;margin:18px 0 8px}
.field{margin-bottom:12px}
.field>label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input[type=text],.field input[type=date],.field select{width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.comments{max-height:240px;overflow:auto;margin-bottom:8px}
.cm{background:var(--panel2);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.cm .when{font-size:11px;color:var(--muted);margin-bottom:2px;display:flex;justify-content:space-between;gap:8px}
.cm .when b{color:var(--text)}
.cm .txt{white-space:pre-wrap;word-wrap:break-word}
.sub-item{display:flex;align-items:center;gap:8px;padding:5px 2px}
.sub-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--s-done)}
.sub-item span{flex:1}
.sub-item.done span{text-decoration:line-through;color:var(--muted)}
.modal-foot{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.meta{font-size:11px;color:var(--muted)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{cursor:pointer}
.swatches input{display:none}
.swatches span{display:block;width:26px;height:26px;border-radius:8px;border:3px solid transparent}
.swatches input:checked+span{border-color:var(--text)}
ol.steps{padding-left:20px;margin:8px 0}
ol.steps li{margin-bottom:8px;line-height:1.45}
.bk-status{padding:10px 12px;border-radius:8px;background:var(--panel2);margin-bottom:14px;font-size:13px;line-height:1.5}
.bk-status.ok{border-left:4px solid var(--s-done)}.bk-status.err{border-left:4px solid var(--danger)}.bk-status.off{border-left:4px solid var(--s-todo)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice .card{padding:14px}
.choice h4{margin:0 0 6px}
/* Toast / pill / gate */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:#1d2330;color:#fff;padding:10px 14px;border-radius:10px;display:flex;gap:14px;align-items:center;z-index:80;transition:transform .2s;box-shadow:0 4px 20px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast button{background:none;border:none;color:#a5b4fc;font-weight:700;cursor:pointer}
.bk-pill{position:fixed;right:16px;bottom:16px;z-index:55;background:var(--danger);color:#fff;border:none;border-radius:99px;padding:10px 16px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25);display:none}
.bk-pill.show{display:block}
.gate{position:fixed;inset:0;background:var(--bg);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
.gate.show{display:flex}
.gate .box{max-width:460px;width:100%;text-align:center;padding:28px}
.gate .box h2{margin:8px 0}
.gate .box p{color:var(--muted);line-height:1.5}
.spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:6px auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;margin-top:12px}
.mobile-top{display:none}
@media (max-width:820px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--border)}
  .nav,.side-foot{display:none}
  .side.open .nav{display:block}
  .side.open .side-foot{display:grid}
  .mobile-top{display:inline-block;margin-left:auto}
  .main{padding:16px}
  .grid3,.grid2,.choice{grid-template-columns:1fr}
  .task{flex-wrap:wrap}
  .task .title{flex-basis:calc(100% - 60px)}
  .grip{display:none}
}
@media print{
  .side,.toolbar,.add-task,.btn,.icon-btn,.cbtn,.grip,.seg,.toast,.ov,.bk-pill,.gate{display:none!important}
  .main{padding:0}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
  .heading.collapsed .heading-body{display:block}
}
</style>
</head>
<body class="role-admin">
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo">✓</div>Feature Tracker
      <button class="btn sm mobile-top" onclick="document.getElementById('side').classList.toggle('open')">☰ Menu</button>
    </div>
    <div class="who" id="who"></div>
    <div class="nav" id="nav"></div>
    <div class="side-foot">
      <button class="btn sm" id="syncBtn" onclick="openSync()" style="grid-column:1/-1"></button>
      <button class="btn sm" onclick="exportData()" title="Download a full backup (.json)">⬇ Download</button>
      <button class="btn sm adm" onclick="document.getElementById('importFile').click()" title="Restore from a backup file">⬆ Restore</button>
      <button class="btn sm" onclick="exportCSV()" title="Download all tasks as a spreadsheet">📄 Excel/CSV</button>
      <button class="btn sm" onclick="window.print()" title="Print or save the current view as PDF">🖨 Print</button>
      <button class="btn sm" id="themeBtn" onclick="cycleTheme()" style="grid-column:1/-1"></button>
      <input type="file" id="importFile" accept=".json,application/json" hidden onchange="importData(this)">
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="ov" id="ov" onmousedown="if(event.target===this)closeModal()"><div class="modal card" id="modal"></div></div>
<div class="gate" id="gate"><div class="card box" id="gateBox"></div></div>
<div class="toast" id="toast"></div>
<button class="bk-pill" id="bkPill" onclick="signInAndSync()">☁ Sign in to Google to sync</button>
<datalist id="people"></datalist>

<script>
/* =====================================================================
   CONFIG — fill these in once (see README.md). They are safe to publish:
   Google only accepts them from the website addresses you authorise.
   ===================================================================== */
const GOOGLE_CLIENT_ID = '';   // OAuth 2.0 Client ID  (…apps.googleusercontent.com)
const GOOGLE_API_KEY   = '';   // API key (restricted to Google Picker API + your site)
const GOOGLE_APP_ID    = '';   // Google Cloud project NUMBER (digits only)
/* ===================================================================== */

const KEY = 'software-feature-tracker.v1';
const BKEY = 'software-feature-tracker.sync';
const TKEY = 'software-feature-tracker.gtoken';
const THEME_KEY = 'software-feature-tracker.theme';
const STATUSES = [
  {k:'todo',label:'To Do'},{k:'progress',label:'In Progress'},{k:'testing',label:'Testing'},
  {k:'hold',label:'On Hold'},{k:'done',label:'Done'}
];
const SL = Object.fromEntries(STATUSES.map(s=>[s.k,s.label]));
const TYPES = ['Feature','Change','Bug Fix','Improvement'];
const PRIORITIES = ['Critical','High','Medium','Low'];
const PRANK = {Critical:0,High:1,Medium:2,Low:3};
const COLORS = ['#4f46e5','#0891b2','#16a34a','#ea580c','#db2777','#7c3aed','#ca8a04','#475569'];
const DEFAULT_HEADINGS = ['New Features','Changes Needed','Bug Fixes'];
const TF = ['title','type','priority','status','assignee','due','notes'];   // task fields merged individually
const ROLE_LABEL = {admin:'Admin', member:'Member', viewer:'Viewer'};
const ROLE_HELP = {admin:'adds & edits everything, manages the team', member:'updates status, checklists & comments', viewer:'can only view'};

let db, drag = null, toastTimer = null, ui = null, role = 'admin';
ui = freshUi('dashboard');
function freshUi(view){ return {view, mode:(ui&&ui.mode)||'list', filter:'all', prio:'all', who:'all', swf:'all', q:'', hideDone:false, sort:'due', collapsed:(ui&&ui.collapsed)||{}}; }

/* ---------- Helpers ---------- */
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function now(){ return new Date().toISOString(); }
function todayISO(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function daysUntil(d){ return Math.round((Date.parse(d)-Date.parse(todayISO()))/864e5); }
function fmt(iso){ if(!iso) return ''; const d=new Date(iso); return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function fmtDate(d){ return new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }
function ago(iso){
  const s=(Date.now()-new Date(iso))/1000;
  if(s<45) return 'just now'; if(s<3600) return Math.max(1,Math.floor(s/60))+'m ago';

  return new Date(iso).toLocaleDateString();
}
function byId(list){ const m={}; (list||[]).forEach(x=>m[x.id]=x); return m; }

function findTask(tId){

function allTasks(sw){ return sw.headings.flatMap(h=>h.tasks); }
function entries(){ return db.software.flatMap(sw=>sw.headings.flatMap(h=>h.tasks.map(t=>({sw,h,t})))); }
function counts(tasks){ const c={todo:0,progress:0,testing:0,hold:0,done:0,total:tasks.length}; tasks.forEach(t=>c[t.status]++); return c; }

/* ---------- Merge (so several people can work at the same time) ----------
   Every change is time-stamped. When two copies meet, the newest value of each
   field wins, new items from both sides are kept, and deletions are remembered.  */
function stampOf(e){ return Math.max(e.rAt||0, e.mAt||0, e.at&&typeof e.at==='number'?e.at:0, ...(e.ft?Object.values(e.ft):[0]), Date.parse(e.updated||(typeof e.at==='string'?e.at:'')||e.created||'')||0); }
function alive(e, del){ const d=del[e.id]; return !d || stampOf(e) > d; }
function orderedUnion(a, b, aAt, bAt){
  const [base, other] = (aAt||0) >= (bAt||0) ? [a||[], b||[]] : [b||[], a||[]];
  const ids = base.map(x=>x.id), set = new Set(ids);
  other.forEach((x,i)=>{
    if(set.has(x.id)) return;
    const prev = i>0 ? other[i-1].id : null, pos = prev ? ids.indexOf(prev) : -1;
    ids.splice(pos+1, 0, x.id); set.add(x.id);
  });
  return ids;
}
function mergeTask(a, b){
  const out = {id:a.id, created:a.created||b.created, updated:maxIso(a.updated,b.updated), ft:{}, rAt:Math.max(a.rAt||0,b.rAt||0), soAt:Math.max(a.soAt||0,b.soAt||0)};
  for(const f of TF){ const ta=(a.ft&&a.ft[f])||0, tb=(b.ft&&b.ft[f])||0; out[f] = ta>=tb ? a[f] : b[f]; out.ft[f]=Math.max(ta,tb); }
  out.ft.heading = Math.max((a.ft&&a.ft.heading)||0, (b.ft&&b.ft.heading)||0);
  const cm = {}; [...a.comments, ...b.comments].forEach(c=>{ if(!cm[c.id]) cm[c.id]=c; });
  out.comments = Object.values(cm).sort((x,y)=>String(x.at).localeCompare(String(y.at)));
  const Sa=byId(a.subtasks), Sb=byId(b.subtasks);
  out.subtasks = orderedUnion(a.subtasks, b.subtasks, a.soAt, b.soAt).map(id=>{ const x=Sa[id], y=Sb[id]; return x&&y ? ((x.at||0)>=(y.at||0)?x:y) : (x||y); });
  return out;
}
function mergeSw(a, b){
  const m = (a.mAt||0) >= (b.mAt||0) ? a : b;
  const out = {id:a.id, name:m.name, desc:m.desc, version:m.version, color:m.color, mAt:Math.max(a.mAt||0,b.mAt||0),
    created:a.created||b.created, updated:maxIso(a.updated,b.updated), hoAt:Math.max(a.hoAt||0,b.hoAt||0), rAt:Math.max(a.rAt||0,b.rAt||0)};
  // where does each task live? (the side that moved it most recently wins)
  const loc = {}, Ta = {}, Tb = {};
  const note = (sw, T) => sw.headings.forEach(h=>h.tasks.forEach(t=>{ T[t.id]=t; const at=(t.ft&&t.ft.heading)||0; if(!loc[t.id] || at>loc[t.id].at) loc[t.id]={h:h.id, at}; }));
  note(a, Ta); note(b, Tb);
  const Ha=byId(a.headings), Hb=byId(b.headings);
  out.headings = orderedUnion(a.headings, b.headings, a.hoAt, b.hoAt).map(hid=>{
    const x=Ha[hid], y=Hb[hid], hm = x&&y ? ((x.mAt||0)>=(y.mAt||0)?x:y) : (x||y);
    const tasks = orderedUnion(x?x.tasks:[], y?y.tasks:[], x?x.toAt:0, y?y.toAt:0)
      .filter(id=>loc[id] && loc[id].h===hid)
      .map(id=> Ta[id]&&Tb[id] ? mergeTask(Ta[id],Tb[id]) : (Ta[id]||Tb[id]));
    return {id:hid, name:hm.name, mAt:Math.max((x&&x.mAt)||0,(y&&y.mAt)||0), toAt:Math.max((x&&x.toAt)||0,(y&&y.toAt)||0), rAt:Math.max((x&&x.rAt)||0,(y&&y.rAt)||0), tasks};
  });
  return out;
}
function pruneDeleted(d){
  const del = d.deleted;
  d.software = d.software.filter(s=>alive(s,del));
  d.software.forEach(sw=>{
    sw.headings = sw.headings.filter(h=>alive(h,del));
    sw.headings.forEach(h=>{
      h.tasks = h.tasks.filter(t=>alive(t,del));
      h.tasks.forEach(t=>{ t.comments=t.comments.filter(c=>alive(c,del)); t.subtasks=t.subtasks.filter(s=>alive(s,del)); });
    });
  });
  return d;
}
function mergeDb(L, R){
  const del = {...R.deleted}; Object.entries(L.deleted).forEach(([k,v])=>del[k]=Math.max(del[k]||0,v));
  const La=byId(L.software), Ra=byId(R.software);
  const software = orderedUnion(L.software, R.software, L.swOrderAt, R.swOrderAt).map(id=> La[id]&&Ra[id] ? mergeSw(La[id],Ra[id]) : JSON.parse(JSON.stringify(La[id]||Ra[id])));
  const act = {}; [...L.activity, ...R.activity].forEach(a=>{ const k=a.id||(a.at+a.text); if(!act[k]) act[k]=a; });
  const out = {
    software, deleted:del,
    team: (L.team.mAt||0) >= (R.team.mAt||0) ? L.team : R.team,
    swOrderAt: Math.max(L.swOrderAt||0, R.swOrderAt||0),
    activity: Object.values(act).sort((x,y)=>y.at.localeCompare(x.at)).slice(0,300)
  };
  return migrate(pruneDeleted(out));
}

  if(!ignoreStatus && ui.filter!=='all' && t.status!==ui.filter) return false;
  if(ui.hideDone && t.status==='done') return false;

  const q=ui.q.trim().toLowerCase();
  if(q && !(t.title.toLowerCase().includes(q) || t.notes.toLowerCase().includes(q) || t.assignee.toLowerCase().includes(q) || t.comments.some(x=>x.text.toLowerCase().includes(q)) || t.subtasks.some(x=>x.text.toLowerCase().includes(q)))) return false;
  return true;
}

/* ---------- Drag & drop ---------- */
function dragStart(e,id){ drag=id; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',id);}catch(_){} const el=e.currentTarget; setTimeout(()=>el.classList.add('dragging')); }
function dragEnd(){ drag=null; document.querySelectorAll('.dragging,.drag-over').forEach(x=>x.classList.remove('dragging','drag-over')); }
function dragOver(e){ if(!drag) return; e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function dragLeave(e){ if(!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('drag-over'); }
function dropBoard(e,status){ e.preventDefault(); const id=drag; dragEnd(); if(id) setStatus(id,status); }
function dropList(e,hId){
  e.preventDefault(); const id=drag; dragEnd(); if(!id || !need('admin')) return;
  const {sw,h:src,t} = findTask(id); if(!t) return;
  const dest = sw.headings.find(x=>x.id===hId); if(!dest) return;
  const row = e.target.closest('.task[data-id]');
  src.tasks.splice(src.tasks.indexOf(t),1);
  let i = dest.tasks.length;
  if(row && row.dataset.id!==id){
    i = dest.tasks.findIndex(x=>x.id===row.dataset.id);
    const r=row.getBoundingClientRect(); if(e.clientY>r.top+r.height/2) i++;
    if(i<0) i=dest.tasks.length;
  }
  dest.tasks.splice(i,0,t);
  const ts=Date.now(); dest.toAt=ts; src.toAt=ts;
  if(src!==dest){ log(sw,`Moved "${t.title}" to ${dest.name}`); t.ft.heading=ts; t.updated=now(); }
  touch(sw); save(); render();
}

/* ---------- Modal / toast ---------- */
function openModal(html){ document.getElementById('modal').innerHTML = html; document.getElementById('ov').classList.add('show'); }
function closeModal(){ document.getElementById('ov').classList.remove('show'); document.getElementById('modal').innerHTML=''; }
function modalOpen(){ return document.getElementById('ov').classList.contains('show'); }
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='/' && !modalOpen() && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ const q=document.getElementById('q'); if(q){ e.preventDefault(); q.focus(); } }
});
function toast(msg, undoFn){
  const el=document.getElementById('toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undoFn?'<button id="undoBtn">Undo</button>':''}`;
  el.classList.add('show'); clearTimeout(toastTimer);
  if(undoFn) document.getElementById('undoBtn').onclick=()=>{ undoFn(); el.classList.remove('show'); };
  toastTimer=setTimeout(()=>el.classList.remove('show'), 7000);
}
function withUndo(msg, fn){
  const snap = JSON.stringify(db), delBefore = {...db.deleted};
  fn(); save(); render();
  toast(msg, ()=>{
    const restored = migrate(JSON.parse(snap));
    const newly = new Set(Object.keys(db.deleted).filter(k=>!(k in delBefore)));
    const ts = Date.now()+1;
    walk(restored, e=>{ if(newly.has(e.id)) e.rAt=ts; });   // revive so other people's copies don't delete it again
    db = restored; save(); render(); toast('Restored');
  });
}
function askText(title, label, value, cb){
  openModal(`<h2>${esc(title)}</h2><form id="askf"><div class="field"><label>${esc(label)}</label><input type="text" id="askv" value="${esc(value||'')}" required></div>
    <div class="modal-foot"><span class="spacer"></span><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`);
  const inp = document.getElementById('askv'); inp.focus(); inp.select();
  document.getElementById('askf').onsubmit = e=>{ e.preventDefault(); const v=inp.value.trim(); if(!v) return; closeModal(); cb(v); };
}

    <div class="modal-foot"><span class="spacer"></span><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">${sw?'Save':'Add software'}</button></div></form>`);
  const f=document.getElementById('swf'); f.elements['name'].focus();
  f.onsubmit=e=>{

    if(!v.name) return;

function updTask(tId,field,val){
  const {sw,h,t}=findTask(tId); if(!t) return;
  if(!need(field==='status'?'edit':'admin')) return openTask(tId);
  const ts=Date.now();
  if(field==='title'){ val=val.trim(); if(!val) return openTask(tId); }
  if(field==='heading'){
    if(val===h.id) return;
    const dest=sw.headings.find(x=>x.id===val); h.tasks.splice(h.tasks.indexOf(t),1); dest.tasks.push(t);
    dest.toAt=ts; h.toAt=ts; t.ft.heading=ts; log(sw,`Moved "${t.title}" to ${dest.name}`);
  } else if(field==='status'){
    if(t.status!==val){ t.comments.push({id:uid(), text:`Status changed: ${SL[t.status]} → ${SL[val]}`, at:now(), system:true, by:myName(), em:bk.email||''}); log(sw,`"${t.title}" → ${SL[val]}`); }
    t.status=val; t.ft.status=ts;
  } else {
    if(field==='assignee' && val!==t.assignee) log(sw,`"${t.title}" assigned to ${val||'nobody'}`);
    if(field==='due' && val!==t.due) log(sw,`"${t.title}" due date ${val?'set to '+fmtDate(val):'removed'}`);
    t[field]=val; t.ft[field]=ts;
  }
  t.updated=now(); touch(sw); save(); render();
  if(['status','heading','due','assignee'].includes(field)) openTask(tId);
}

// Replace everything with a backup. In shared mode this is made "authoritative" so it wins for everyone.
function replaceAllWith(d){
  d = migrate(JSON.parse(JSON.stringify(d)));
  if(syncOn()){
    const ts=Date.now(), keep=new Set();
    walk(d, e=>{ keep.add(e.id); e.rAt=ts; if('mAt' in e) e.mAt=ts; if(e.ft){ TF.forEach(f=>e.ft[f]=ts); e.ft.heading=ts; e.soAt=ts; } if('hoAt' in e) e.hoAt=ts; if('toAt' in e) e.toAt=ts; if('done' in e) e.at=ts; });
    d.swOrderAt=ts;
    walk(db, e=>{ if(!keep.has(e.id)) d.deleted[e.id]=ts; });
    Object.entries(db.deleted).forEach(([k,v])=>{ if(!keep.has(k)) d.deleted[k]=Math.max(d.deleted[k]||0,v); });
    d.team = db.team; d.activity = db.activity;
  }
  db = d;
}
function importData(input){

  const r=new FileReader();

    try{
      const d=JSON.parse(r.result);
      if(!d || !Array.isArray(d.software)) throw new Error('bad');
      if(confirm(`Replace ${syncOn()?'the shared data for EVERYONE':'current data'} with this backup (${plural(d.software.length,'software')})?`)){
        const snap=JSON.stringify(db); replaceAllWith(d);
        db.activity.unshift({id:uid(),at:now(),sw:'',swName:'Tracker',text:'Data restored from a backup file',by:myName()});
        save(); go('dashboard');

      }
    }catch(e){ alert('That file is not a valid tracker backup.'); }
    input.value='';
  };
  r.readAsText(file);
}

/* =====================================================================
   TEAM SYNC through Google Drive
   - One shared file (feature-tracker-data.json) lives in the Admin's Drive
     and is shared with the team.
   - On opening the site, the latest shared data is ALWAYS loaded first;
     nothing is saved until that has happened.
   - Changes are merged field by field, so people can work at the same time.
   ===================================================================== */
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';   // app sees only files it created or you picked
const DATA_FOLDER = 'Feature Tracker (shared)';
const DATA_NAME = 'feature-tracker-data.json';
const SNAP_FOLDER = 'Feature Tracker Backups';

let gTok = loadTok(), tokenClient = null, tokWaiters = [], gisPromise = null, pickerPromise = null;
let sync = {pulled:false, busy:false, version:null, canEdit:null, err:'', readOnly:false, timer:null, owner:'', perms:null, snaps:null};

function defBk(){ return {fileId:'', fileName:'', email:'', name:'', clientId:'', apiKey:'', appId:'', keep:30, dirty:false, changedAt:0, lastSync:'', snapAt:0, snapFolderId:''}; }
function loadBk(){ try{ return Object.assign(defBk(), JSON.parse(localStorage.getItem(BKEY))||{}); }catch(e){ return defBk(); } }
function saveBk(){ try{ localStorage.setItem(BKEY, JSON.stringify(bk)); }catch(e){} }
function syncOn(){ return !!(bk && bk.fileId); }
function cfg(k){ return ({clientId:GOOGLE_CLIENT_ID, apiKey:GOOGLE_API_KEY, appId:GOOGLE_APP_ID})[k] || bk[k] || ''; }
function markDirty(){ if(!bk || !syncOn()) return; bk.dirty=true; bk.changedAt=Date.now(); saveBk(); scheduleSync(); renderSyncUi(); }
function scheduleSync(){ clearTimeout(sync.timer); sync.timer=setTimeout(()=>syncNow(), 2500); }

/* --- Google sign-in (Google Identity Services, token flow) --- */
function loadTok(){ try{ const t=JSON.parse(sessionStorage.getItem(TKEY)); if(t && t.exp>Date.now()) return t; }catch(e){} return null; }
function tokValid(){ return !!(gTok && gTok.exp > Date.now()+60e3); }
function dropTok(){ gTok=null; try{ sessionStorage.removeItem(TKEY); }catch(e){} }
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.async=true; s.onload=()=>ok(); s.onerror=()=>no(new Error('Could not load '+src+'. Check your internet connection.')); document.head.appendChild(s); }); }
function loadGis(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if(!gisPromise) gisPromise = loadScript('https://accounts.google.com/gsi/client').catch(e=>{ gisPromise=null; throw e; });
  return gisPromise;
}
function getTokenClient(){
  if(tokenClient && tokenClient._cid===cfg('clientId')) return tokenClient;
  tokenClient = google.accounts.oauth2.initTokenClient({client_id:cfg('clientId'), scope:DRIVE_SCOPE, callback:onToken, error_callback:onTokenError});
  tokenClient._cid = cfg('clientId');
  return tokenClient;
}
function signIn(prompt){   // call from a click — Google opens a pop-up
  return new Promise(async (ok,no)=>{
    if(IS_FILE) return no(new Error('Google sign-in only works when the tracker is opened from its web address (e.g. GitHub Pages), not as a file.'));
    if(!cfg('clientId')) return no(new Error('The Google OAuth Client ID is not set yet (see README).'));
    try{ await loadGis(); }catch(e){ return no(e); }
    tokWaiters.push({ok,no});
    const opts = {prompt: prompt!==undefined ? prompt : (bk.email ? '' : 'select_account')};
    if(bk.email) opts.login_hint = bk.email;
    try{ getTokenClient().requestAccessToken(opts); }catch(e){ tokWaiters.splice(0).forEach(w=>w.no(e)); }
  });
}
function onToken(r){
  const w = tokWaiters.splice(0);
  if(r.error) return w.forEach(x=>x.no(new Error(r.error_description || r.error)));
  if(!google.accounts.oauth2.hasGrantedAllScopes(r, DRIVE_SCOPE)) return w.forEach(x=>x.no(new Error('Google Drive access was not allowed. Sign in again and tick the Google Drive permission.')));
  gTok = {access_token:r.access_token, exp:Date.now()+(Number(r.expires_in)||3600)*1000};
  try{ sessionStorage.setItem(TKEY, JSON.stringify(gTok)); }catch(e){}
  renderSyncUi();
  w.forEach(x=>x.ok());
}
function onTokenError(e){
  const msg = e && e.type==='popup_closed' ? 'The Google sign-in window was closed.'
    : e && e.type==='popup_failed_to_open' ? 'The pop-up was blocked. Allow pop-ups for this site and try again.'
    : (e && e.message) || 'Google sign-in failed.';
  tokWaiters.splice(0).forEach(x=>x.no(new Error(msg)));
}
function signOutGoogle(){
  if(gTok && window.google && google.accounts && google.accounts.oauth2){ try{ google.accounts.oauth2.revoke(gTok.access_token, ()=>{}); }catch(e){} }
  dropTok();
}

/* --- Google Drive API --- */
function authError(){ const e=new Error('Your Google sign-in has expired. Sign in again to keep syncing.'); e.auth=true; return e; }
async function gdrive(path, opt, raw){
  opt = opt || {};
  if(!tokValid()) throw authError();
  const url = path.startsWith('http') ? path : 'https://www.googleapis.com/drive/v3/'+path;
  let res;
  try{ res = await fetch(url, {...opt, headers:{Authorization:'Bearer '+gTok.access_token, ...(opt.headers||{})}}); }
  catch(e){ throw new Error('Could not reach Google Drive. Check your internet connection.'); }
  if(res.status===401){ dropTok(); throw authError(); }
  if(!res.ok){
    let m='HTTP '+res.status; try{ const j=await res.json(); if(j.error && j.error.message) m=j.error.message; }catch(e){}
    if(res.status===403 && /has not been used|is disabled/i.test(m)) m='The Google Drive API is not enabled in your Google Cloud project.';
    if(res.status===404) m='The shared file was not found, or you do not have access to it.';
    const err=new Error('Google Drive: '+m); err.status=res.status; throw err;
  }
  if(raw) return res;
  return res.status===204 ? null : res.json();
}
const qEsc = s => s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
async function findOrCreateFolder(name){
  const q = encodeURIComponent(`name='${qEsc(name)}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const l = await gdrive(`files?q=${q}&fields=files(id)&spaces=drive`);
  if(l.files && l.files[0]) return l.files[0].id;
  return (await gdrive('files?fields=id', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, mimeType:'application/vnd.google-apps.folder'})})).id;
}
function multipart(meta, text){
  const b='tracker'+uid();
  return {b, body:`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${text}\r\n--${b}--`};
}
async function createDriveFile(folderId, name, text, fields){
  const {b, body} = multipart({name, parents:[folderId], mimeType:'application/json'}, text);
  return gdrive(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=${fields||'id'}`, {method:'POST', headers:{'Content-Type':'multipart/related; boundary='+b}, body});
}

/* --- Google Picker (lets a team member open the file shared with them) --- */
function loadPicker(){

async function pickSharedFile(fileId){

/* --- The sync engine: always READ first, merge, then WRITE --- */
async function syncNow(opts){
  opts = opts || {};
  if(!syncOn() || sync.busy) return;
  if(!tokValid()){ renderSyncUi(); return; }
  sync.busy=true; renderSyncUi();
  try{
    const startedAt = bk.changedAt;
    const meta = await gdrive(`files/${bk.fileId}?fields=id,name,version,owners(emailAddress,displayName),capabilities(canEdit,canShare)&supportsAllDrives=true`);
    let remote = {software:[]};
    try{ remote = await (await gdrive(`files/${bk.fileId}?alt=media&supportsAllDrives=true`, {}, true)).json(); }catch(e){ if(e.auth||e.status) throw e; }
    sync.canEdit = meta.capabilities ? meta.capabilities.canEdit!==false : true;
    sync.owner = meta.owners && meta.owners[0] ? (meta.owners[0].displayName || meta.owners[0].emailAddress) : '';
    bk.fileName = meta.name;
    const before = JSON.stringify(db);
    const wasPulled = sync.pulled;
    db = mergeDb(db, migrate(remote));          // 1. bring in everyone else's changes
    sync.pulled = true; computeRole();
    if(bk.dirty && canEdit()){                    // 2. then save ours (only after reading)
      const up = await gdrive(`https://www.googleapis.com/upload/drive/v3/files/${bk.fileId}?uploadType=media&fields=version&supportsAllDrives=true`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(db)});
      sync.version = up.version;
      bk.dirty = bk.changedAt > startedAt;
    } else {
      sync.version = meta.version;
      if(!canEdit()) bk.dirty = false;
    }
    saveQuiet(); bk.lastSync = now(); sync.err=''; saveBk();
    if(JSON.stringify(db)!==before || !wasPulled) render();
    if(isAdmin()) maybeSnapshot();
  }catch(e){
    if(!e.auth) sync.err = e.message;
    if(opts.manual) toast(e.message);
  }finally{
    sync.busy=false; renderSyncUi();
    if(bk.dirty && tokValid() && !sync.err) scheduleSync();
    if(modalOpen() && document.getElementById('syncmodal')) openSync();
  }
}
async function pollRemote(){
  renderSyncUi();
  if(!syncOn() || sync.busy || !tokValid() || document.visibilityState==='hidden' || sync.readOnly) return;
  if(bk.dirty || !sync.pulled) return syncNow();
  try{ const m = await gdrive(`files/${bk.fileId}?fields=version&supportsAllDrives=true`); if(m.version!==sync.version) syncNow(); }
  catch(e){ renderSyncUi(); }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') pollRemote(); });
window.addEventListener('beforeunload', e=>{ if(syncOn() && bk.dirty && tokValid()){ e.preventDefault(); e.returnValue=''; } });

/* --- daily safety snapshots (Admins only, in the Admin's own Drive) --- */
async function maybeSnapshot(){
  if(Date.now()-(bk.snapAt||0) < 3600e3) return;
  try{
    const fid = bk.snapFolderId || (bk.snapFolderId = await findOrCreateFolder(SNAP_FOLDER));
    const q = encodeURIComponent(`'${fid}' in parents and trashed=false`);
    const files = (await gdrive(`files?q=${q}&fields=files(id,name)&pageSize=1000`)).files || [];
    const name = `feature-tracker-${todayISO()}.json`, ex = files.find(f=>f.name===name), json = JSON.stringify(db);
    if(ex) await gdrive(`https://www.googleapis.com/upload/drive/v3/files/${ex.id}?uploadType=media&fields=id`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:json});
    else await createDriveFile(fid, name, json);
    const daily = files.filter(f=>DAILY_RE.test(f.name)); if(!ex) daily.push({name});
    daily.sort((a,b)=>b.name.localeCompare(a.name)).slice(bk.keep).forEach(f=>{ if(f.id) gdrive(`files/${f.id}?fields=id`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({trashed:true})}).catch(()=>{}); });
    bk.snapAt = Date.now(); saveBk();
  }catch(e){ if(e.status===404){ bk.snapFolderId=''; saveBk(); } }
}
async function loadSnaps(){
  try{
    const fid = bk.snapFolderId || (bk.snapFolderId = await findOrCreateFolder(SNAP_FOLDER));
    const q = encodeURIComponent(`'${fid}' in parents and trashed=false`);
    sync.snaps = ((await gdrive(`files?q=${q}&fields=files(id,name,modifiedTime,size)&orderBy=name%20desc&pageSize=1000`)).files||[]).filter(f=>DAILY_RE.test(f.name));
    saveBk(); openSync();
  }catch(e){ toast(e.message); }
}
async function restoreSnap(id, name){
  if(!need('admin')) return;
  try{
    const d = await (await gdrive(`files/${id}?alt=media`, {}, true)).json();
    if(!d || !Array.isArray(d.software)) throw new Error('That backup file is not valid');
    if(!confirm(`Replace the shared data for EVERYONE with the backup from ${fmtDate(name.slice(16,26))}?`)) return;
    replaceAllWith(d);
    db.activity.unshift({id:uid(),at:now(),sw:'',swName:'Tracker',text:`Data restored from the ${fmtDate(name.slice(16,26))} backup`,by:myName()});
    save(); closeModal(); go('dashboard'); toast('Backup restored for everyone');
  }catch(e){ toast('Restore failed: '+e.message); }
}

/* --- connecting --- */
async function ensureSignedIn(){ if(!tokValid()){ await signIn(); } if(!bk.email) await fetchMe(); }
async function createShared(){
  if(!need('admin')) return;
  try{
    await ensureSignedIn();
    toast('Creating the shared tracker in your Google Drive…');
    db.team = {owner:bk.email, roles:{}, mAt:Date.now()};
    const folderId = await findOrCreateFolder(DATA_FOLDER);
    const f = await createDriveFile(folderId, DATA_NAME, JSON.stringify(db), 'id,name,version');
    Object.assign(bk, {fileId:f.id, fileName:f.name, dirty:false}); saveBk();
    sync.pulled=true; sync.version=f.version; sync.canEdit=true; sync.perms=null;
    saveQuiet(); render(); openSync(); toast('Shared tracker created — now invite your team');
  }catch(e){ toast(e.message); }
}
async function openShared(fileId){
  try{
    await ensureSignedIn();
    let id = fileId;
    let direct = false;
    if(id){ try{ await gdrive(`files/${id}?fields=id&supportsAllDrives=true`); direct=true; }catch(e){ if(e.auth) throw e; } }
    if(!direct) id = await pickSharedFile(fileId);
    await connectFile(id);
  }catch(e){ toast(e.message); if(document.getElementById('gate').classList.contains('show')) showGate(fileId?'join':'signin', e.message); }
}
async function connectFile(id){
  try{ const prev=localStorage.getItem(KEY); if(prev && !syncOn()) localStorage.setItem(KEY+'.before-sharing', prev); }catch(e){}
  Object.assign(bk, {fileId:id, dirty:false, snapAt:0}); saveBk();
  db = migrate({software:[]}); sync = {...sync, pulled:false, version:null, err:'', readOnly:false, perms:null, snaps:null};
  showGate('loading');
  await syncNow({manual:true});
  if(sync.pulled){ hideGate(); clearJoinHash(); go('dashboard'); toast(`Connected · you are ${ROLE_LABEL[role]==='Admin'?'an':'a'} ${ROLE_LABEL[role]}`); }
  else showGate('signin', sync.err);
}
function disconnect(){
  if(!confirm('Stop syncing on this browser? The shared file stays in Google Drive, and this browser keeps a local copy.')) return;
  Object.assign(bk, {fileId:'', fileName:'', dirty:false}); saveBk();
  sync = {...sync, pulled:false, version:null, err:'', perms:null, snaps:null};
  render(); openSync();
}
async function signInAndSync(){
  try{ await signIn(); await fetchMe(); }catch(e){ return toast(e.message); }
  sync.readOnly=false; await syncNow({manual:true}); render();
}

/* --- team management (Admin) --- */
async function loadPerms(){
  try{
    const r = await gdrive(`files/${bk.fileId}/permissions?fields=permissions(id,emailAddress,displayName,role,type)&supportsAllDrives=true`);
    sync.perms = (r.permissions||[]).filter(p=>p.type==='user');
  }catch(e){ sync.perms = []; toast(e.message); }
  if(modalOpen() && document.getElementById('syncmodal')) openSync();
}
function driveRoleFor(appRole){ return appRole==='viewer' ? 'reader' : 'writer'; }
async function invitePerson(){
  if(!need('admin')) return;
  const email = document.getElementById('invEmail').value.trim().toLowerCase(), r = document.getElementById('invRole').value;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('Enter a valid email address');
  const btn=document.getElementById('invBtn'); btn.disabled=true; btn.textContent='Inviting…';
  try{
    const msg = `You've been added to the Feature Tracker as ${ROLE_LABEL[r]}. Open it here and sign in with this Google account: ${siteLink()}`;
    await gdrive(`files/${bk.fileId}/permissions?sendNotificationEmail=true&emailMessage=${encodeURIComponent(msg)}&supportsAllDrives=true`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({type:'user', role:driveRoleFor(r), emailAddress:email})});
    db.team.roles[email]=r; db.team.mAt=Date.now(); save();
    toast(`Invited ${email} as ${ROLE_LABEL[r]}`); sync.perms=null; loadPerms();
  }catch(e){ toast(e.message); btn.disabled=false; btn.textContent='Invite'; }
}
async function changeRole(email, permId, r){
  if(!need('admin')) return;
  try{
    await gdrive(`files/${bk.fileId}/permissions/${permId}?supportsAllDrives=true`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({role:driveRoleFor(r)})});
    db.team.roles[email]=r; db.team.mAt=Date.now(); save(); toast(`${email} is now ${ROLE_LABEL[r]}`); loadPerms();
  }catch(e){ toast(e.message); }
}
async function removePerson(email, permId){
  if(!need('admin') || !confirm(`Remove ${email} from the tracker? They will lose access to the shared file.`)) return;
  try{
    await gdrive(`files/${bk.fileId}/permissions/${permId}?supportsAllDrives=true`, {method:'DELETE'});
    delete db.team.roles[email]; db.team.mAt=Date.now(); save(); toast(`Removed ${email}`); loadPerms();
  }catch(e){ toast(e.message); }
}
function copyInvite(){
  const t=siteLink(), done=()=>toast('Invite link copied');
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,()=>{ document.getElementById('invLink').select(); toast('Press Ctrl+C to copy'); });
  else { document.getElementById('invLink').select(); toast('Press Ctrl+C to copy'); }
}
function saveConfig(){
  const v = k => { const el=document.getElementById('cfg_'+k); return el ? el.value.trim() : bk[k]; };
  const cid=v('clientId');
  if(cid && !/\.apps\.googleusercontent\.com$/.test(cid)) return toast('The Client ID should end with .apps.googleusercontent.com');
  if(cid!==bk.clientId){ signOutGoogle(); tokenClient=null; }
  Object.assign(bk,{clientId:cid, apiKey:v('apiKey'), appId:v('appId')}); saveBk(); toast('Saved'); openSync();
}

/* --- UI: sidebar button, pill, gate, modal --- */
function renderSyncUi(){
  const b=document.getElementById('syncBtn'), pill=document.getElementById('bkPill'); if(!b) return;
  b.className='btn sm'; let pillOn=false;
  if(!syncOn()) b.textContent='👥 Set up team sync (Google Drive)';
  else if(sync.busy) b.textContent='⟳ Syncing…';
  else if(!tokValid()){ b.textContent = bk.dirty ? '⚠ Sign in — changes not synced' : '⚠ Sign in to sync'; b.classList.add('err'); pillOn=true; }
  else if(sync.err){ b.textContent='⚠ Sync problem — click'; b.classList.add('err'); }
  else { b.classList.add('ok'); b.textContent = bk.lastSync ? `✓ Synced ${ago(bk.lastSync)}${bk.dirty?' · saving…':''}` : '✓ Connected'; }
  if(pill){ pill.classList.toggle('show', pillOn && !document.getElementById('gate').classList.contains('show')); pill.textContent = bk.dirty ? '☁ Sign in to Google to save your changes' : '☁ Sign in to Google to see the latest updates'; }
}
function showGate(kind, msg){
  const box=document.getElementById('gateBox'), err = msg ? `<div class="bk-status err" style="text-align:left">${esc(msg)}</div>` : '';
  if(kind==='loading') box.innerHTML = `<div class="spin"></div><h2>Loading the latest data…</h2><p>Getting the newest version of the shared tracker from Google Drive.</p>`;
  else if(kind==='join') box.innerHTML = `<div style="font-size:40px">👋</div><h2>You've been invited</h2><p>This Feature Tracker is shared through Google Drive. Sign in with the Google account the invitation was sent to.</p>${err}
      <button class="btn primary" style="padding:10px 18px" onclick="openShared('${esc(pendingJoin)}')">🔐 Sign in with Google &amp; open</button>
      ${syncOn()?'':`<br><button class="linkbtn" onclick="clearJoinHash();hideGate()">Not now</button>`}`;
  else box.innerHTML = `<div style="font-size:40px">☁</div><h2>Sign in to load the latest data</h2><p>This tracker is shared with your team. To make sure you see everyone's latest updates, the newest data is loaded from Google Drive before you start.</p>${err}
      <button class="btn primary" style="padding:10px 18px" onclick="gateSignIn()">🔐 Sign in with Google</button><br>
      <button class="linkbtn" onclick="viewOffline()">View the last copy saved on this device (read-only)</button>`;
  document.getElementById('gate').classList.add('show'); renderSyncUi();
}
function hideGate(){ document.getElementById('gate').classList.remove('show'); renderSyncUi(); }
async function gateSignIn(){
  try{ await signIn(); await fetchMe(); }catch(e){ return showGate('signin', e.message); }
  showGate('loading'); sync.readOnly=false;
  await syncNow({manual:true});
  if(sync.pulled){ hideGate(); render(); } else showGate('signin', sync.err || 'Could not load the shared data.');
}
function viewOffline(){ sync.readOnly=true; hideGate(); render(); toast('Read-only: sign in to make changes'); }
let pendingJoin = '';
function clearJoinHash(){ pendingJoin=''; try{ if(location.hash.startsWith('#join=')) history.replaceState(null,'',location.pathname+location.search); }catch(e){} }

function openSync(){
  const signed = tokValid(), on = syncOn();
  const origin = (IS_FILE || location.origin==='null') ? 'https://YOUR-USERNAME.github.io' : location.origin;
  const needCfg = !GOOGLE_CLIENT_ID || !GOOGLE_API_KEY || !GOOGLE_APP_ID;
  const status = !on ? `<div class="bk-status off"><b>Not shared yet.</b> Your data is only saved in this browser. Connect to Google Drive so your team can see and update the same tracker from anywhere.</div>`
    : !signed ? `<div class="bk-status err">Signed out of Google (Google only allows 1 hour at a time). ${bk.dirty?'<b>Your latest changes are not synced yet.</b>':'You may not be seeing the latest updates.'}<br><button class="btn sm primary" style="margin-top:6px" onclick="signInAndSync()">🔐 Sign in &amp; sync</button></div>`
    : sync.err ? `<div class="bk-status err"><b>Sync problem:</b> ${esc(sync.err)}<br><button class="btn sm" style="margin-top:6px" onclick="syncNow({manual:true})">Try again</button></div>`
    : `<div class="bk-status ok">✓ Synced with <b>${esc(bk.fileName||DATA_NAME)}</b>${sync.owner?` (owned by ${esc(sync.owner)})`:''}. ${bk.lastSync?'Last sync '+fmt(bk.lastSync)+'.':''}<br>You are signed in as <b>${esc(bk.email)}</b> · role <b>${ROLE_LABEL[role]}</b> (${ROLE_HELP[role]}).</div>`;

  const cfgBlock = needCfg && !IS_FILE ? `
    <details ${cfg('clientId')&&cfg('apiKey')&&cfg('appId')?'':'open'} style="margin:4px 0 12px"><summary style="cursor:pointer;font-weight:600">Google connection settings</summary>
      <p class="meta">Best: put these in the <b>CONFIG</b> section at the top of <code>index.html</code> so everyone gets them automatically. See README.md for how to create them. Authorized JavaScript origin to use: <code>${esc(origin)}</code></p>
      ${GOOGLE_CLIENT_ID?'':`<div class="field"><label>OAuth Client ID</label><input type="text" id="cfg_clientId" value="${esc(bk.clientId)}" placeholder="…apps.googleusercontent.com" style="width:100%"></div>`}
      ${GOOGLE_API_KEY?'':`<div class="field"><label>API key (for Google Picker)</label><input type="text" id="cfg_apiKey" value="${esc(bk.apiKey)}" placeholder="AIza…" style="width:100%"></div>`}
      ${GOOGLE_APP_ID?'':`<div class="field"><label>Project number</label><input type="text" id="cfg_appId" value="${esc(bk.appId)}" placeholder="123456789012" style="width:100%"></div>`}
      <button class="btn sm" onclick="saveConfig()">Save settings</button>
    </details>` : '';

  let body = '';
  if(IS_FILE){
    body = `<div class="bk-status err">Google sign-in doesn't work when the tracker is opened as a file from your computer. Open it from its web address (your GitHub Pages link).</div>`;
  } else if(!on){
    body = `${cfgBlock}
      <div class="choice">
        <div class="card"><h4>🆕 Start a shared tracker</h4><p class="meta">For the Admin. Puts your current data (${plural(db.software.length,'software')}) into a new file in your Google Drive. You can then invite your team.</p><button class="btn primary" onclick="createShared()" ${cfg('clientId')?'':'disabled'}>Create shared tracker</button></div>
        <div class="card"><h4>📂 Open a tracker shared with me</h4><p class="meta">For team members. Easiest: use the invite link from your Admin. Otherwise, pick the shared file from your Drive here.</p><button class="btn" onclick="openShared()" ${cfg('clientId')?'':'disabled'}>Open shared tracker</button></div>
      </div>`;
  } else {
    const adminBlock = isAdmin() && signed && !sync.err ? `
      <h3>👥 Team</h3>
      ${sync.perms===null ? '<p class="meta">Loading people…</p>' : `<ul class="card list">${sync.perms.map(p=>{
          const em=(p.emailAddress||'').toLowerCase(), isOwner=p.role==='owner';
          const r = isOwner ? 'admin' : (db.team.roles[em] || (p.role==='reader'?'viewer':'member'));
          return `<li><span class="t"><b>${esc(p.displayName||em)}</b> <span class="meta">${esc(em)}</span></span>
            ${isOwner?'<span class="pill">Owner · Admin</span>':`<select onchange="changeRole('${esc(em)}','${p.id}',this.value)">${['admin','member','viewer'].map(x=>`<option value="${x}" ${r===x?'selected':''}>${ROLE_LABEL[x]}</option>`).join('')}</select>
            <button class="icon-btn" title="Remove" onclick="removePerson('${esc(em)}','${p.id}')">✕</button>`}</li>`;}).join('')}</ul>`}
      <div class="row" style="margin-top:10px"><input type="email" id="invEmail" placeholder="teammate@gmail.com" style="flex:1;min-width:200px">
        <select id="invRole">${['member','admin','viewer'].map(x=>`<option value="${x}">${ROLE_LABEL[x]}</option>`).join('')}</select>
        <button class="btn primary" id="invBtn" onclick="invitePerson()">Invite</button></div>
      <p class="meta" style="margin:6px 0 0"><b>Member</b>: ${ROLE_HELP.member}. <b>Admin</b>: ${ROLE_HELP.admin}. <b>Viewer</b>: ${ROLE_HELP.viewer}. Google emails the invitation with this link; you can also send it yourself (e.g. on WhatsApp):</p>
      <div class="row" style="margin-top:6px"><input type="text" id="invLink" readonly value="${esc(siteLink())}" style="flex:1;min-width:200px;font-size:12px"><button class="btn sm" onclick="copyInvite()">📋 Copy link</button></div>

      <h3>🗂 Daily backups (in your Drive → "${SNAP_FOLDER}")</h3>
      <div class="row"><label class="meta">Keep</label><select onchange="bk.keep=+this.value;saveBk()">${[7,14,30,60,90,365].map(n=>`<option value="${n}" ${bk.keep===n?'selected':''}>${n} days</option>`).join('')}</select>
        <span class="spacer"></span><button class="btn sm" onclick="loadSnaps()">${sync.snaps?'↻ Refresh':'Show backups'}</button></div>
      ${sync.snaps ? (sync.snaps.length ? `<ul class="card list" style="margin-top:8px;max-height:200px;overflow:auto">${sync.snaps.map(f=>`<li><span class="t">${esc(fmtDate(f.name.slice(16,26)))}</span><span class="m">${fmt(f.modifiedTime)} · ${Math.max(1,Math.round((+f.size||0)/1024))} KB</span><button class="btn sm" onclick="restoreSnap('${f.id}','${esc(f.name)}')">Restore</button></li>`).join('')}</ul>` : '<p class="meta">No backups yet. One is saved each day while an Admin uses the tracker.</p>') : ''}` : '';
    body = `${cfgBlock}${adminBlock}`;
  }
  openModal(`<div id="syncmodal"><div class="row" style="margin-bottom:12px"><h2 style="margin:0">👥 Team sync · Google Drive</h2><span class="spacer"></span><button class="icon-btn" onclick="closeModal()">✕</button></div>
    ${status}${body}
    <div class="modal-foot">
      ${on && signed ? `<button class="btn primary" onclick="syncNow({manual:true})" ${sync.busy?'disabled':''}>⟳ Sync now</button>` : ''}
      ${on && signed ? `<button class="btn sm" onclick="signOutGoogle();bk.email='';saveBk();render();openSync()">Switch account</button>` : ''}
      <span class="spacer"></span>
      ${on ? `<button class="btn danger" onclick="disconnect()">Stop syncing here</button>` : ''}
      <button class="btn" onclick="closeModal()">Close</button>
    </div></div>`);
  if(on && signed && isAdmin() && sync.perms===null && !sync.err) loadPerms();
  if(!IS_FILE && cfg('clientId')) loadGis().catch(()=>{});
}

/* --- startup: load the latest shared data BEFORE anything else --- */
async function initSync(){
  const m = location.hash.match(/^#join=([\w-]+)/);
  if(m && m[1]!==bk.fileId){ pendingJoin=m[1]; if(!IS_FILE && cfg('clientId')) loadGis().catch(()=>{}); showGate('join'); }
  else if(m) clearJoinHash();
  if(syncOn() && !pendingJoin){
    if(tokValid()){ showGate('loading'); await syncNow(); if(sync.pulled) hideGate(); else showGate('signin', sync.err); }
    else { if(!IS_FILE && cfg('clientId')) loadGis().catch(()=>{}); showGate('signin'); }
  }
  render();
  setInterval(pollRemote, 20000);
}

/* ---------- Init ---------- */
db = migrate(load());
applyTheme();
render();
initSync();
</script>
